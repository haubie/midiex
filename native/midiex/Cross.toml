[build.env]
passthrough = [
  "RUSTLER_NIF_VERSION",
  "PKG_CONFIG_ALLOW_CROSS"
]

# 1. Standard x86_64 Linux (GLIBC)
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge"
pre-build = [
  "apt-get update && apt-get install -y alsa-utils alsa-tools libasound2-dev libudev-dev pkg-config portaudio19-dev build-essential libpulse-dev libdbus-1-dev llvm-dev libclang-dev clang"
]

# 2. ARM64 Linux (GLIBC)
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update && apt-get install -y libasound2-dev:arm64 libudev-dev:arm64 portaudio19-dev:arm64 libpulse-dev:arm64 libdbus-1-dev:arm64 pkg-config build-essential"
]

# 3. RISC-V 64 Linux (GLIBC) - Compilers are pre-baked into this image
# [target.riscv64gc-unknown-linux-gnu]
# image = "ghcr.io/cross-rs/riscv64gc-unknown-linux-gnu:edge"
# pre-build = [
#   "dpkg --add-architecture riscv64",
#   "apt-get update && apt-get install -y crossbuild-essential-riscv64 libasound2-dev:riscv64 libudev-dev:riscv64 pkg-config"
# ]

[target.riscv64gc-unknown-linux-gnu]
image = "ghcr.io/cross-rs/riscv64gc-unknown-linux-gnu:edge"
pre-build = [
  "dpkg --add-architecture riscv64",
  "echo 'deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse' > /etc/apt/sources.list.d/riscv64.list",
  "echo 'deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse' >> /etc/apt/sources.list.d/riscv64.list",
  "echo 'deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse' >> /etc/apt/sources.list.d/riscv64.list",
  "apt-get update && apt-get install -y crossbuild-essential-riscv64 libasound2-dev:riscv64 libudev-dev:riscv64 pkg-config"
]

