# 4. x86_64 Linux (MUSL) - Compiling static ALSA with unversioned symbols
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:edge"
pre-build = [
  "apt-get update && apt-get install -y wget bzip2 make build-essential pkg-config",
  "wget https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.11.tar.bz2 && tar -xf alsa-lib-1.2.11.tar.bz2",
  "cd alsa-lib-1.2.11 && CC=x86_64-linux-musl-gcc CFLAGS=\"-fPIC\" ./configure --host=x86_64-linux-musl --enable-static --disable-shared --with-pic --with-versioned=no --prefix=/usr/local && make && make install"
]

# 5. ARM64 Linux (MUSL) - Cross-compiling static ALSA with unversioned symbols
[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:edge"
pre-build = [
  "apt-get update && apt-get install -y wget bzip2 make build-essential pkg-config",
  "wget https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.11.tar.bz2 && tar -xf alsa-lib-1.2.11.tar.bz2",
  "cd alsa-lib-1.2.11 && CC=aarch64-linux-musl-gcc CFLAGS=\"-fPIC\" ./configure --host=aarch64-linux-musl --enable-static --disable-shared --with-pic --with-versioned=no --prefix=/usr/local && make && make install"
]

