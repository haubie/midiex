[build.env]
passthrough = [
  "RUSTLER_NIF_VERSION"
]

# 1. Standard x86_64 Linux (no extra architecture needed)
[target.x86_64-unknown-linux-gnu]
pre-build = [
  "apt-get update && apt-get install -y musl-tools alsa-utils alsa-tools libasound2-dev libudev-dev pkg-config portaudio19-dev build-essential libpulse-dev libdbus-1-dev llvm-dev libclang-dev clang"
]

# 3. ARM64 GNU
[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update",
  "apt-get install -y libasound2-dev:arm64 pkg-config"
]

# 5. RISC-V 64 GNU
[target.riscv64gc-unknown-linux-gnu]
dockerfile = "Dockerfile.riscv64gc-unknown-linux-gnu-custom"
pre-build = [
  "dpkg --add-architecture riscv64",
  "apt-get update",
  "apt-get install -y wget gcc-riscv64-linux-gnu libc6-riscv64-cross crossbuild-essential-riscv64 libasound2-dev:riscv64 pkg-config"
]

[target.x86_64-unknown-linux-musl]
pre-build = [
  "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y --no-install-recommends musl-tools pkg-config build-essential"
]

[target.aarch64-unknown-linux-musl]
pre-build = [
  "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y --no-install-recommends musl-tools pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
]
