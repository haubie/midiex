[build.env]
passthrough = [
  "RUSTLER_NIF_VERSION"
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update",
  "apt-get install -y libasound2-dev:arm64 pkg-config"
]

[target.aarch64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install -y libasound2-dev pkg-config"]

[target.x86_64-unknown-linux-gnu]
pre-build = ["apt-get update && apt-get install -y libasound2-dev pkg-config"]
